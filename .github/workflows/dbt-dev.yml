name: dbt Production Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt-prod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ubioworos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-databricks
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks

      - name: Verify profile file and run dbt debug
        env:
          DATABRICKS_PROD_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
          DATABRICKS_PROD_HTTP_PATH: ${{ secrets.DATABRICKS_PROD_HTTP_PATH }}
          DATABRICKS_PROD_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
        run: |
          ls -la
          cd ubioworos
          dbt debug --target dev 
          dbt parse --target dev 

      - name: Run freshness and dbt build for prod
        env:
          DATABRICKS_PROD_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
          DATABRICKS_PROD_HTTP_PATH: ${{ secrets.DATABRICKS_PROD_HTTP_PATH }}
          DATABRICKS_PROD_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
        run: |
          dbt source freshness --target dev --profiles-dir . || true
          dbt build --target dev --profiles-dir .
