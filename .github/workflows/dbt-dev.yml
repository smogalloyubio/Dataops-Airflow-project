name: dbt Production Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt-prod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ubioworos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-databricks
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks

      - name: Create profiles.yml and validate prod target
        env:
          DATABRICKS_PROD_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
          DATABRICKS_PROD_HTTP_PATH: ${{ secrets.DATABRICKS_PROD_HTTP_PATH }}
          DATABRICKS_PROD_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
        run: |
          cat << 'EOF' > profiles.yml
          ubioworos:
            target: dev
            outputs:
              prod:
                type: databricks
                catalog: dbt_toturial_dev
                schema: source
                host: "{{ env_var('DATABRICKS_PROD_HOSTS') }}"
                http_path: "{{ env_var('DATABRICKS_PROD_HTTP_PATHS') }}"
                token: "{{ env_var('DATABRICKS_PROD_TOKEN') }}"
                threads: 2
          EOF
          ls -la profiles.yml
          dbt debug --target prod --profiles-dir .
          dbt parse --target prod --profiles-dir .

      - name: Run freshness and dbt build for prod
        env:
          DATABRICKS_PROD_HOST: ${{ secrets.DATABRICKS_PROD_HOSTS }}
          DATABRICKS_PROD_HTTP_PATH: ${{ secrets.DATABRICKS_PROD_HTTP_PATHS }}
          DATABRICKS_PROD_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
        run: |
          dbt source freshness --target prod --profiles-dir . || true
          dbt build --target prod --profiles-dir .